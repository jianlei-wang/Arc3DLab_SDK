name: Release Verify

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 要验证的发布 tag，例如 v2.0.0
        required: true

permissions:
  contents: read

# 发布验证只打包与归档，不自动执行 npm publish；发布凭据与人工确认留在发布流程中。
jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    with:
      ref: ${{ inputs.tag || github.ref }}

  package:
    name: package
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Verify tag points to checked-out commit
        run: |
          test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$(git rev-parse HEAD)"
      - name: Verify release metadata
        run: node scripts/release-check.mjs --tag "$RELEASE_TAG"
      - name: Release preflight
        run: node scripts/release-preflight.mjs --tag "$RELEASE_TAG"
      - run: npm run build
      - name: Pack release tarball
        run: |
          mkdir -p release
          npm pack --pack-destination release
          cd release
          sha256sum ./*.tgz > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: release-tarball
          path: |
            release/*.tgz
            release/SHA256SUMS
          retention-days: 30
