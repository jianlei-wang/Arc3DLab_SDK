name: Quality

on:
  workflow_call:
    inputs:
      ref:
        description: 要验证的 Git ref；省略时使用调用方 ref。
        required: false
        type: string

permissions:
  contents: read

# 开发分支、发布分支与发布 tag 复用同一套最低质量门禁，避免 workflow 漂移。
jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run gate:release
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: api-docs
          path: api-docs/
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: guide-dist
          path: guide/.vitepress/dist/
          retention-days: 7

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      # Firefox 无头模式不提供 WebGL2，需在 Xvfb 虚拟显示中以有头模式运行。
      - run: npm run test:e2e
      - run: xvfb-run -a npm run test:e2e:firefox
      - run: npm run build
      - run: npm run test:consumer
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  compat:
    name: compat (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:pack

  sandcastle:
    name: sandcastle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: demo-vue3/package-lock.json
      - run: npm ci
        working-directory: demo-vue3
      - run: npm run build
        working-directory: demo-vue3
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: sandcastle-dist
          path: demo-vue3/dist/
          retention-days: 7
