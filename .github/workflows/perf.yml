name: Perf Trend

on:
  schedule:
    # 每天 02:17 UTC 采集一次真实浏览器性能趋势。
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# 所有 Actions 须使用 node24 运行时；checkout/setup-node/upload-artifact 均为 v7 起。
jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run browser performance trend
        env:
          PERF: "1"
        run: npm run test:e2e -- e2e/perf.spec.ts
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: perf-report
          path: playwright-report/
          retention-days: 14
